<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StillInLife</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #d8cfc0;
    font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 14px 20px; display: flex; align-items: baseline; gap: 14px;
    background: linear-gradient(#000 55%, rgba(0,0,0,0)); pointer-events: none;
  }
  header h1 { font-size: 20px; font-weight: normal; letter-spacing: .06em; }
  header .count { font-size: 13px; color: #7d7264; }
  .rail {
    height: 100vh; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .track { display: flex; align-items: center; height: 100vh; width: max-content; }
  figure { position: relative; flex: 0 0 auto; height: 100vh; }
  figure img { display: block; height: 100vh; width: auto; }
  /* Left-edge fade so a slice cross-dissolves over the previous one at the seam. */
  figure.seamed { -webkit-mask-image: linear-gradient(to right, transparent, #000 7%);
    mask-image: linear-gradient(to right, transparent, #000 7%); }
  figure.object figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 40px 16px 18px; font-size: 12px; line-height: 1.45;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.85));
    opacity: 0; transition: opacity .25s;
  }
  figure.object:hover figcaption { opacity: 1; }
  figcaption .obj { font-size: 14px; color: #e8dcc8; }
  figcaption .date { color: #8a7d6c; letter-spacing: .05em; }
  figcaption .sym { color: #b3a892; margin-top: 4px; font-style: italic; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; color: #6d6355; padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>StillInLife</h1>
  <span class="count" id="count"></span>
</header>
<div class="rail" id="rail"><div class="track" id="track"></div></div>

<script>
(() => {
  const rail = document.getElementById('rail');
  const track = document.getElementById('track');
  const countEl = document.getElementById('count');

  const DAY = 86400;                 // secondi in un giorno
  const RESUME_DELAY = 4000;         // ms: dopo il drag torna alla posizione "live"
  const REFRESH_MS = 10 * 60 * 1000; // ricontrolla il manifest ogni 10 min
  const OVERLAP_FRAC = 0.06;         // quanto ogni fetta si sovrappone alla precedente (nasconde la giunzione)

  let anchors = [];   // [{t: epoch_sec, x: pixel}] — le bande oggetto + la coda virtuale
  let maxScroll = 0;
  let signature = '';
  let paused = false;
  let resumeTimer = null;

  function figureFor(slice) {
    const fig = document.createElement('figure');
    fig.className = slice.type === 'object' ? 'object' : 'filler';
    const img = document.createElement('img');
    img.src = slice.file;
    img.alt = slice.object || slice.date;
    fig.append(img);
    if (slice.type === 'object') {
      const cap = document.createElement('figcaption');
      cap.innerHTML =
        `<div class="date">${slice.date}</div>` +
        `<div class="obj">${slice.object || ''}</div>` +
        (slice.symbolism ? `<div class="sym">${slice.symbolism}</div>` : '');
      fig.append(cap);
    }
    return fig;
  }

  // Mappa tempo→pixel: interpolazione lineare fra le bande oggetto (ognuna
  // ancorata al suo 09:00). Ogni segmento giorno scorre in esattamente 24h.
  function measure(slices) {
    anchors = [];
    const figs = Array.from(track.children);
    slices.forEach((s, i) => {
      if (s.type === 'object' && s.anchor) {
        const t = Date.parse(s.anchor) / 1000;
        if (!isNaN(t)) anchors.push({ t, x: figs[i].offsetLeft });
      }
    });
    // Coda virtuale: fine dell'ultimo filler, raggiunta al 09:00 del giorno dopo.
    if (anchors.length) {
      const last = anchors[anchors.length - 1];
      anchors.push({ t: last.t + DAY, x: track.scrollWidth });
    }
    maxScroll = Math.max(0, track.scrollWidth - rail.clientWidth);
  }

  function pixelAt(nowSec) {
    if (anchors.length === 0) return 0;
    if (nowSec <= anchors[0].t) return anchors[0].x;
    const end = anchors[anchors.length - 1];
    if (nowSec >= end.t) return end.x;
    for (let i = 0; i < anchors.length - 1; i++) {
      const a = anchors[i], b = anchors[i + 1];
      if (nowSec >= a.t && nowSec < b.t) {
        const f = (nowSec - a.t) / (b.t - a.t);
        return a.x + (b.x - a.x) * f;
      }
    }
    return end.x;
  }

  function build(slices) {
    track.innerHTML = '';
    for (const s of slices) track.append(figureFor(s));
    const objects = slices.filter(s => s.type === 'object').length;
    countEl.textContent = objects + (objects === 1 ? ' giorno' : ' giorni');

    const imgs = Array.from(track.querySelectorAll('img'));
    let left = imgs.length;
    if (left === 0) { measure(slices); return; }
    const done = () => {
      if (--left !== 0) return;
      // Overlap each slice onto the previous one to swallow the duplicated seam.
      const figs = Array.from(track.children);
      figs.forEach((f, i) => {
        if (i === 0) return;
        f.classList.add('seamed');
        f.style.marginLeft = `-${Math.round(f.offsetWidth * OVERLAP_FRAC)}px`;
      });
      measure(slices);
    };
    for (const im of imgs) {
      if (im.complete) done();
      else { im.addEventListener('load', done); im.addEventListener('error', done); }
    }
  }

  async function loadManifest() {
    try {
      const res = await fetch('state/manifest.json', { cache: 'no-store' });
      const data = await res.json();
      data.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
      return data;
    } catch (e) { return []; }
  }

  function render(slices) {
    if (!slices.length) {
      track.innerHTML = '';
      rail.insertAdjacentHTML('beforeend',
        '<p class="empty">La tavola è ancora vuota.<br>La prima fetta arriva domani alle 9.</p>');
      return;
    }
    const empty = rail.querySelector('.empty');
    if (empty) empty.remove();
    build(slices);
  }

  function tick() {
    if (!paused && anchors.length) {
      // now-line = bordo destro del viewport → il visibile è il passato.
      const target = pixelAt(Date.now() / 1000) - rail.clientWidth;
      rail.scrollLeft = Math.max(0, Math.min(maxScroll, target));
    }
    requestAnimationFrame(tick);
  }

  // Drag: pausa, poi torna alla posizione live.
  const pause = () => { paused = true; if (resumeTimer) clearTimeout(resumeTimer); };
  const scheduleResume = () => {
    if (resumeTimer) clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { paused = false; }, RESUME_DELAY);
  };
  rail.addEventListener('pointerdown', pause);
  rail.addEventListener('wheel', () => { pause(); scheduleResume(); }, { passive: true });
  window.addEventListener('pointerup', scheduleResume);
  window.addEventListener('pointercancel', scheduleResume);
  window.addEventListener('resize', () => { maxScroll = Math.max(0, track.scrollWidth - rail.clientWidth); });

  (async () => {
    const first = await loadManifest();
    signature = first.map(s => s.file).join(',');
    render(first);
    requestAnimationFrame(tick);

    setInterval(async () => {
      const slices = await loadManifest();
      const sig = slices.map(s => s.file).join(',');
      if (sig !== signature) { signature = sig; render(slices); }
    }, REFRESH_MS);
  })();
})();
</script>
</body>
</html>
